server {
    listen 8085;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OPTIONAL: simple reverse proxy to backend if you want same-origin API
    # If your Laravel API is reachable at http://host.docker.internal (mac/win) or http://backend:8000 in compose network:
    # location /api/ {
    #     proxy_pass http://host.docker.internal:8000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Basic gzip
    gzip on;
    gzip_types text/plain application/json text/css application/javascript application/xml;
}
