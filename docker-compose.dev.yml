version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pos-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      # Point your frontend to the API (Laravel) URL
      VITE_API_URL: "http://localhost:8080/api"
    volumes:
      - .:/app
      - /app/node_modules
